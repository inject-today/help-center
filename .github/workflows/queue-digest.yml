name: Mod queue digest

on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HOOK: ${{ secrets.DISCORD_QUEUE_WEBHOOK }}
    steps:
      - name: Post submissions waiting more than 48 hours
        run: |
          [ -z "$HOOK" ] && exit 0
          list=$(gh pr list -R "$GITHUB_REPOSITORY" --label status/needs-review --limit 100 \
            --json number,title,url,createdAt \
            --jq '[.[] | select(.createdAt < (now - 172800 | todate))
                   | "- [#\(.number) \(.title)](\(.url))"] | join("\n")')
          [ -z "$list" ] && exit 0
          jq -n --arg d "$list" '{embeds: [{title: "Waiting more than 48 hours", description: ($d | .[0:4000])}]}' \
            | curl -sfS -H 'Content-Type: application/json' -d @- "$HOOK"
